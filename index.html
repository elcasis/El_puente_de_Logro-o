<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>El puente de Logroño</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            color: #fff;
            touch-action: none; /* Evita zoom y scroll global */
        }

        /* --- PANTALLA DE INICIO --- */
        #startScreen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        #startScreen h1 {
            font-size: clamp(28px, 7vw, 45px);
            color: #f1c40f;
            text-align: center;
            margin-bottom: 10px;
            text-shadow: 3px 3px 0 #000;
        }
        #startScreen p {
            font-size: clamp(14px, 3.5vw, 18px);
            color: #ccc;
            margin-bottom: 40px;
            text-align: center;
            padding: 0 20px;
        }
        #startBtn {
            font-family: monospace;
            font-size: clamp(20px, 5vw, 28px);
            font-weight: bold;
            padding: 20px 50px;
            background-color: #c0392b;
            color: white;
            border: 4px solid #e74c3c;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
        }
        #startBtn:active {
            transform: scale(0.95);
            background-color: #e74c3c;
        }

        /* --- LAYOUT PRINCIPAL (JUEGO + MANDO) --- */
        #gameWrapper {
            width: 100%;
            max-width: 800px;
            height: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        /* --- INTERFAZ SUPERIOR --- */
        #ui {
            position: absolute;
            top: 0; left: 0; right: 0;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
            pointer-events: none;
            z-index: 10;
        }
        .game-title {
            font-size: clamp(16px, 4vw, 24px);
            font-weight: bold;
            color: #f1c40f;
            text-shadow: 2px 2px 0 #000;
        }
        .game-score {
            font-size: clamp(14px, 3vw, 20px);
            text-shadow: 2px 2px 0 #000;
        }
        .game-score span {
            color: #ff3333;
            font-weight: bold;
        }

        /* --- CANVAS --- */
        canvas {
            background-color: #2c5f8a;
            width: 100%;
            flex-grow: 1; /* Ocupa el espacio que deja el mando */
            display: block;
        }

        /* --- MANDO TÁCTIL --- */
        #gamepad {
            height: 140px;
            background-color: #1a1a1a;
            border-top: 3px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            z-index: 20;
        }
        .pad-side {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .pad-side.right {
            flex-direction: column;
            gap: 10px;
        }
        .ctrl-btn {
            background-color: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: manipulation;
            transition: background-color 0.05s;
        }
        .ctrl-btn.active {
            background-color: rgba(255, 255, 255, 0.5);
            border-color: rgba(255, 255, 255, 0.8);
        }
        
        /* Botones específicos */
        .btn-dir {
            width: 60px;
            height: 60px;
            font-size: 24px;
        }
        .btn-gas {
            width: 90px;
            height: 55px;
            font-size: 20px;
            font-weight: bold;
            background-color: rgba(46, 204, 113, 0.3);
            border-color: rgba(46, 204, 113, 0.6);
        }
        .btn-gas.active { background-color: rgba(46, 204, 113, 0.7); }
        
        .btn-brake {
            width: 90px;
            height: 45px;
            font-size: 20px;
            font-weight: bold;
            background-color: rgba(231, 76, 60, 0.3);
            border-color: rgba(231, 76, 60, 0.6);
        }
        .btn-brake.active { background-color: rgba(231, 76, 60, 0.7); }

    </style>
</head>
<body>

    <!-- PANTALLA DE INICIO -->
    <div id="startScreen">
        <h1>El puente de Logroño</h1>
        <p>¡Acelera y destroza todos los postes que puedas!</p>
        <button id="startBtn">JUGAR</button>
    </div>

    <!-- CONTENEDOR DEL JUEGO -->
    <div id="gameWrapper">
        <div id="ui">
            <div class="game-title">Logroño</div>
            <div class="game-score">POSTES: <span id="score">0</span></div>
        </div>
        
        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <!-- MANDO TÁCTIL SEPARADO DEL CANVAS -->
        <div id="gamepad">
            <div class="pad-side left">
                <button class="ctrl-btn btn-dir" id="btnLeft">◀</button>
                <button class="ctrl-btn btn-dir" id="btnRight">▶</button>
            </div>
            <div class="pad-side right">
                <button class="ctrl-btn btn-gas" id="btnUp">GAS ▲</button>
                <button class="ctrl-btn btn-brake" id="btnDown">FRENO ▼</button>
            </div>
        </div>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreElement = document.getElementById('score');
    const startScreen = document.getElementById('startScreen');
    const startBtn = document.getElementById('startBtn');

    // --- ESTADOS DEL JUEGO ---
    let gameStarted = false;
    let score = 0;
    let gameOver = false;

    // --- CONFIGURACIÓN DEL MUNDO ---
    const BRIDGE_WIDTH = 250;
    const BRIDGE_LEFT = (canvas.width - BRIDGE_WIDTH) / 2;
    const BRIDGE_RIGHT = BRIDGE_LEFT + BRIDGE_WIDTH;
    const BRIDGE_LENGTH = 4000; 
    const FINISH_LINE_Y = -BRIDGE_LENGTH + 200;

    // --- MODELO DEL COCHE ---
    const car = {
        x: canvas.width / 2,
        y: canvas.height - 100,
        width: 40,
        height: 20,
        radius: 20,
        angle: 0,          
        speed: 0,
        maxSpeed: 7,
        backSpeed: -3,
        acc: 0.15,         
        friction: 0.05,    
        turnSpeed: 0.04    
    };

    // --- POSTES ---
    const posts = [];
    function generatePosts() {
        for (let y = 0; y > -BRIDGE_LENGTH; y -= 80) {
            const numPosts = Math.floor(Math.random() * 3) + 1;
            for (let i = 0; i < numPosts; i++) {
                posts.push({
                    x: BRIDGE_LEFT + 30 + Math.random() * (BRIDGE_WIDTH - 60),
                    y: y,
                    radius: 8,
                    knockedDown: false,
                    opacity: 1
                });
            }
        }
    }
    generatePosts();

    // --- GESTIÓN DE INPUTS ---
    const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };

    // Teclado PC
    window.addEventListener('keydown', (e) => {
        if (e.key in keys) { keys[e.key] = true; e.preventDefault(); }
        if (e.key === 'r' && gameOver) location.reload();
    });
    window.addEventListener('keyup', (e) => {
        if (e.key in keys) keys[e.key] = false;
    });

    // Configuración Ultra-Robusta de Botones Táctiles
    function setupTouchButton(id, keyName) {
        const btn = document.getElementById(id);
        
        const press = (e) => {
            e.preventDefault();
            keys[keyName] = true;
            btn.classList.add('active'); // Feedback visual
        };
        
        const release = (e) => {
            e.preventDefault();
            keys[keyName] = false;
            btn.classList.remove('active');
        };

        // Usamos Pointer Events (une ratón y táctil)
        btn.addEventListener('pointerdown', press);
        btn.addEventListener('pointerup', release);
        btn.addEventListener('pointerleave', release); // Si el dedo se sale del botón
        btn.addEventListener('pointercancel', release); // Si el sistema cancela el toque
    }

    setupTouchButton('btnUp', 'ArrowUp');
    setupTouchButton('btnDown', 'ArrowDown');
    setupTouchButton('btnLeft', 'ArrowLeft');
    setupTouchButton('btnRight', 'ArrowRight');

    // --- INICIO DEL JUEGO ---
    startBtn.addEventListener('click', () => {
        gameStarted = true;
        startScreen.style.display = 'none';
    });

    // --- LÓGICA DE LAS FÍSICAS ---
    function update() {
        if (!gameStarted || gameOver) return;

        if (keys.ArrowUp) {
            car.speed = Math.min(car.speed + car.acc, car.maxSpeed);
        } else if (keys.ArrowDown) {
            car.speed = Math.max(car.speed - car.acc, car.backSpeed);
        } else {
            if (car.speed > 0) car.speed = Math.max(car.speed - car.friction, 0);
            if (car.speed < 0) car.speed = Math.min(car.speed + car.friction, 0);
        }

        if (car.speed !== 0) {
            const direction = car.speed > 0 ? 1 : -1;
            if (keys.ArrowLeft)  car.angle -= car.turnSpeed * direction;
            if (keys.ArrowRight) car.angle += car.turnSpeed * direction;
        }

        car.x += Math.cos(car.angle) * car.speed;
        car.y += Math.sin(car.angle) * car.speed;

        // Colisiones bordes
        if (car.x < BRIDGE_LEFT + car.width/2) {
            car.x = BRIDGE_LEFT + car.width/2;
            car.speed *= -0.3;
        }
        if (car.x > BRIDGE_RIGHT - car.width/2) {
            car.x = BRIDGE_RIGHT - car.width/2;
            car.speed *= -0.3;
        }
        if (car.y > canvas.height - 50) car.y = canvas.height - 50;

        checkPostCollisions();

        if (car.y < FINISH_LINE_Y) {
            gameOver = true;
        }
    }

    function checkPostCollisions() {
        for (let post of posts) {
            if (post.knockedDown) continue;
            const dx = car.x - post.x;
            const dy = car.y - post.y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < car.radius + post.radius) {
                post.knockedDown = true;
                score += 10;
                scoreElement.innerText = score;
                car.speed *= 0.6; 
            }
        }
    }

    // --- PIPELINE DE RENDERIZADO ---
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        const cameraY = car.y - canvas.height * 0.7; 
        ctx.translate(0, -cameraY);

        // Agua
        ctx.fillStyle = '#2c5f8a';
        ctx.fillRect(0, -BRIDGE_LENGTH - 500, canvas.width, BRIDGE_LENGTH + canvas.height + 1000);

        // Puente
        ctx.fillStyle = '#555';
        ctx.fillRect(BRIDGE_LEFT, -BRIDGE_LENGTH - 100, BRIDGE_WIDTH, BRIDGE_LENGTH + canvas.height + 200);
        
        // Líneas puente
        ctx.strokeStyle = '#fff';
        ctx.setLineDash([20, 15]);
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(canvas.width / 2, canvas.height);
        ctx.lineTo(canvas.width / 2, -BRIDGE_LENGTH - 100);
        ctx.stroke();
        ctx.setLineDash([]);

        // Barreras
        ctx.fillStyle = '#c0392b';
        ctx.fillRect(BRIDGE_LEFT - 10, -BRIDGE_LENGTH - 100, 10, BRIDGE_LENGTH + canvas.height + 200);
        ctx.fillRect(BRIDGE_RIGHT, -BRIDGE_LENGTH - 100, 10, BRIDGE_LENGTH + canvas.height + 200);

        // Meta
        ctx.fillStyle = '#fff';
        ctx.fillRect(BRIDGE_LEFT, FINISH_LINE_Y, BRIDGE_WIDTH, 5);
        ctx.save();
        ctx.font = "bold 20px 'Courier New', monospace";
        ctx.fillStyle = '#2ecc71';
        ctx.textAlign = 'center';
        ctx.fillText("LOGROÑO", canvas.width/2, FINISH_LINE_Y - 10);
        ctx.restore();

        // Postes
        for (let post of posts) {
            if (post.knockedDown) {
                post.opacity -= 0.02;
                if (post.opacity <= 0) continue;
                ctx.globalAlpha = post.opacity;
                ctx.fillStyle = '#95a5a6';
                ctx.beginPath();
                ctx.ellipse(post.x, post.y, post.radius * 1.5, post.radius / 2, Math.random() * Math.PI, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            } else {
                ctx.fillStyle = '#f1c40f';
                ctx.beginPath();
                ctx.arc(post.x, post.y, post.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#d35400';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        // Coche
        ctx.save();
        ctx.translate(car.x, car.y);
        ctx.rotate(car.angle);
        ctx.fillStyle = '#ff3333';
        ctx.fillRect(-car.width / 2, -car.height / 2, car.width, car.height);
        ctx.fillStyle = '#cc0000';
        ctx.fillRect(-5, -car.height/2 + 3, 15, car.height - 6);
        ctx.fillStyle = '#ffff00';
        ctx.fillRect(car.width / 2 - 5, -car.height / 2 + 2, 5, 4);
        ctx.fillRect(car.width / 2 - 5, car.height / 2 - 6, 5, 4);
        ctx.fillStyle = '#ff0000';
        ctx.fillRect(-car.width / 2, -car.height / 2 + 2, 3, 4);
        ctx.fillRect(-car.width / 2, car.height / 2 - 6, 3, 4);
        ctx.restore();

        ctx.restore(); // Cámara

        // --- PANTALLA DE VICTORIA ---
        if (gameOver) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.textAlign = 'center';
            
            ctx.font = 'bold 24px monospace';
            ctx.fillStyle = '#f1c40f';
            ctx.fillText('¡BIENVENIDO A', canvas.width/2, canvas.height/2 - 60);
            
            ctx.font = 'bold 40px monospace';
            ctx.fillStyle = '#fff';
            ctx.fillText('LOGROÑO!', canvas.width/2, canvas.height/2 - 20);
            
            ctx.font = '24px monospace';
            ctx.fillStyle = '#ff3333';
            ctx.fillText(`POSTES: ${score}`, canvas.width/2, canvas.height/2 + 30);
            
            ctx.font = '18px monospace';
            ctx.fillStyle = '#aaa';
            ctx.fillText('Recarga para volver a jugar', canvas.width/2, canvas.height/2 + 70);
        }
    }

    // --- GAME LOOP ---
    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
</script>

</body>
</html>
