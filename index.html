<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El puente de Logroño</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            color: #fff;
        }
        canvas {
            background-color: #2c5f8a; /* Color agua */
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid #555;
        }
        /* Nuevo estilo para la interfaz con el título */
        #ui {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 800px; /* Mismo ancho que el canvas */
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
            pointer-events: none;
            z-index: 10;
        }
        .game-title {
            font-size: 24px;
            font-weight: bold;
            color: #f1c40f;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0 #000;
        }
        .game-score {
            font-size: 20px;
            text-shadow: 2px 2px 0 #000;
        }
        .game-score span {
            color: #ff3333;
            font-weight: bold;
            font-size: 24px;
        }
    </style>
</head>
<body>

    <div id="ui">
        <div class="game-title">El puente de Logroño</div>
        <div class="game-score">POSTES: <span id="score">0</span></div>
    </div>
    
    <canvas id="gameCanvas" width="800" height="600"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreElement = document.getElementById('score');

    // --- CONFIGURACIÓN DEL MUNDO ---
    const BRIDGE_WIDTH = 250;
    const BRIDGE_LEFT = (canvas.width - BRIDGE_WIDTH) / 2;
    const BRIDGE_RIGHT = BRIDGE_LEFT + BRIDGE_WIDTH;
    const BRIDGE_LENGTH = 4000; 
    
    const FINISH_LINE_Y = -BRIDGE_LENGTH + 200;

    // --- ESTADO DEL JUEGO ---
    let score = 0;
    let gameOver = false;

    // --- MODELO DEL COCHE ---
    const car = {
        x: canvas.width / 2,
        y: canvas.height - 100,
        width: 40,
        height: 20,
        radius: 20,
        angle: 0,          
        speed: 0,
        maxSpeed: 7,
        backSpeed: -3,
        acc: 0.15,         
        friction: 0.05,    
        turnSpeed: 0.04    
    };

    // --- POSTES ---
    const posts = [];
    function generatePosts() {
        for (let y = 0; y > -BRIDGE_LENGTH; y -= 80) {
            const numPosts = Math.floor(Math.random() * 3) + 1;
            for (let i = 0; i < numPosts; i++) {
                posts.push({
                    x: BRIDGE_LEFT + 30 + Math.random() * (BRIDGE_WIDTH - 60),
                    y: y,
                    radius: 8,
                    knockedDown: false,
                    opacity: 1
                });
            }
        }
    }
    generatePosts();

    // --- GESTIÓN DE INPUTS ---
    const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };

    window.addEventListener('keydown', (e) => {
        if (e.key in keys) {
            keys[e.key] = true;
            e.preventDefault();
        }
        if (e.key === 'r' && gameOver) {
            location.reload();
        }
    });

    window.addEventListener('keyup', (e) => {
        if (e.key in keys) keys[e.key] = false;
    });

    // --- LÓGICA DE LAS FÍSICAS ---
    function update() {
        if (gameOver) return;

        if (keys.ArrowUp) {
            car.speed = Math.min(car.speed + car.acc, car.maxSpeed);
        } else if (keys.ArrowDown) {
            car.speed = Math.max(car.speed - car.acc, car.backSpeed);
        } else {
            if (car.speed > 0) car.speed = Math.max(car.speed - car.friction, 0);
            if (car.speed < 0) car.speed = Math.min(car.speed + car.friction, 0);
        }

        if (car.speed !== 0) {
            const direction = car.speed > 0 ? 1 : -1;
            if (keys.ArrowLeft)  car.angle -= car.turnSpeed * direction;
            if (keys.ArrowRight) car.angle += car.turnSpeed * direction;
        }

        car.x += Math.cos(car.angle) * car.speed;
        car.y += Math.sin(car.angle) * car.speed;

        // Colisiones con los bordes del puente
        if (car.x < BRIDGE_LEFT + car.width/2) {
            car.x = BRIDGE_LEFT + car.width/2;
            car.speed *= -0.3;
        }
        if (car.x > BRIDGE_RIGHT - car.width/2) {
            car.x = BRIDGE_RIGHT - car.width/2;
            car.speed *= -0.3;
        }
        
        if (car.y > canvas.height - 50) car.y = canvas.height - 50;

        checkPostCollisions();

        if (car.y < FINISH_LINE_Y) {
            gameOver = true;
        }
    }

    function checkPostCollisions() {
        for (let post of posts) {
            if (post.knockedDown) continue;

            const dx = car.x - post.x;
            const dy = car.y - post.y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < car.radius + post.radius) {
                post.knockedDown = true;
                score += 10;
                scoreElement.innerText = score;
                car.speed *= 0.6; 
            }
        }
    }

    // --- PIPELINE DE RENDERIZADO ---
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // --- SISTEMA DE CÁMARA ---
        ctx.save();
        const cameraY = car.y - canvas.height * 0.7; 
        ctx.translate(0, -cameraY);

        // Dibujar Agua
        ctx.fillStyle = '#2c5f8a';
        ctx.fillRect(0, -BRIDGE_LENGTH - 500, canvas.width, BRIDGE_LENGTH + canvas.height + 1000);

        // Dibujar Puente
        ctx.fillStyle = '#555';
        ctx.fillRect(BRIDGE_LEFT, -BRIDGE_LENGTH - 100, BRIDGE_WIDTH, BRIDGE_LENGTH + canvas.height + 200);
        
        // Líneas del puente
        ctx.strokeStyle = '#fff';
        ctx.setLineDash([20, 15]);
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(canvas.width / 2, canvas.height);
        ctx.lineTo(canvas.width / 2, -BRIDGE_LENGTH - 100);
        ctx.stroke();
        ctx.setLineDash([]);

        // Bordes del puente (Barreras)
        ctx.fillStyle = '#c0392b';
        ctx.fillRect(BRIDGE_LEFT - 10, -BRIDGE_LENGTH - 100, 10, BRIDGE_LENGTH + canvas.height + 200);
        ctx.fillRect(BRIDGE_RIGHT, -BRIDGE_LENGTH - 100, 10, BRIDGE_LENGTH + canvas.height + 200);

        // Dibujar Meta
        ctx.fillStyle = '#fff';
        ctx.fillRect(BRIDGE_LEFT, FINISH_LINE_Y, BRIDGE_WIDTH, 5);
        
        // Texto de meta en el suelo
        ctx.save();
        ctx.font = "bold 20px 'Courier New', monospace";
        ctx.fillStyle = '#2ecc71';
        ctx.textAlign = 'center';
        ctx.fillText("LOGROÑO", canvas.width/2, FINISH_LINE_Y - 10);
        ctx.restore();

        // Dibujar Postes
        for (let post of posts) {
            if (post.knockedDown) {
                post.opacity -= 0.02;
                if (post.opacity <= 0) continue;
                
                ctx.globalAlpha = post.opacity;
                ctx.fillStyle = '#95a5a6';
                ctx.beginPath();
                ctx.ellipse(post.x, post.y, post.radius * 1.5, post.radius / 2, Math.random() * Math.PI, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            } else {
                ctx.fillStyle = '#f1c40f';
                ctx.beginPath();
                ctx.arc(post.x, post.y, post.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#d35400';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        // Dibujar Coche
        ctx.save();
        ctx.translate(car.x, car.y);
        ctx.rotate(car.angle);

        ctx.fillStyle = '#ff3333';
        ctx.fillRect(-car.width / 2, -car.height / 2, car.width, car.height);
        
        ctx.fillStyle = '#cc0000';
        ctx.fillRect(-5, -car.height/2 + 3, 15, car.height - 6);

        ctx.fillStyle = '#ffff00';
        ctx.fillRect(car.width / 2 - 5, -car.height / 2 + 2, 5, 4);
        ctx.fillRect(car.width / 2 - 5, car.height / 2 - 6, 5, 4);

        ctx.fillStyle = '#ff0000';
        ctx.fillRect(-car.width / 2, -car.height / 2 + 2, 3, 4);
        ctx.fillRect(-car.width / 2, car.height / 2 - 6, 3, 4);

        ctx.restore();

        ctx.restore(); // Restaurar cámara

        // --- PANTALLA DE VICTORIA ---
        if (gameOver) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.textAlign = 'center';
            
            ctx.font = 'bold 20px monospace';
            ctx.fillStyle = '#f1c40f';
            ctx.fillText('¡BIENVENIDO A', canvas.width/2, canvas.height/2 - 60);
            
            ctx.font = 'bold 40px monospace';
            ctx.fillStyle = '#fff';
            ctx.fillText('EL PUENTE DE LOGROÑO!', canvas.width/2, canvas.height/2 - 20);
            
            ctx.font = '24px monospace';
            ctx.fillStyle = '#ff3333';
            ctx.fillText(`POSTES DESTROZADOS: ${score}`, canvas.width/2, canvas.height/2 + 30);
            
            ctx.font = '18px monospace';
            ctx.fillStyle = '#aaa';
            ctx.fillText('Presiona "R" para volver a cruzar', canvas.width/2, canvas.height/2 + 70);
        }
    }

    // --- GAME LOOP ---
    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
</script>

</body>
</html>
